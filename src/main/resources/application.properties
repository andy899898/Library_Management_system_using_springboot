spring.application.name=Library_management_system
spring.datasource.url=jdbc:mysql://localhost:3306/library_management_system
spring.datasource.username=root
spring.datasource.password=root
# defines ddl - auto mode, handling DDL commands

#ddl-auto - 'update' for development - uses existing table, creates new if its not there
#ddl-auto - 'none' for production - no structural changes in table allowed
spring.jpa.hibernate.ddl-auto=update    

#optional properties - only in development
spring.jpa.show-sql=true
spring.jpa.properties.format_sql=true
